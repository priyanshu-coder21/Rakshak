<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch board – Rakshak</title>
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body data-page="board">
<header class="top"></header>
<main>
<section class="cta">
  <div><h2>In danger or need help?</h2><p>Send a distress call and get a token to track your rescue.</p></div>
  <a class="btn" href="/static/report.html">Report distress</a>
</section>

<div class="actions">
  <a class="btn action a-register" href="/static/teams.html">Register rescue team</a>
  <button id="runDispatch" class="btn action a-run">Run dispatch</button>
  <a class="btn action a-track" href="/static/track.html">Track report</a>
  <a class="btn action a-teams" href="/static/teams.html#list">View rescue teams</a>
  <a class="btn action a-log" href="/static/logs.html">Dispatch log</a>
</div>

<div class="stats" id="stats"></div>

<div class="head-row">
  <h2>All requests</h2>
  <span class="hint" id="updated"></span>
  <label>Show <select id="ticketFilter"><option value="all" selected>All</option><option value="Pending">Pending</option><option value="Dispatched">Dispatched</option><option value="Resolved">Resolved</option></select></label>
</div>
<div class="tablewrap"><table>
  <thead><tr><th>Token</th><th>Message</th><th>Severity</th><th>Vulnerability</th><th>Status</th><th>Team</th><th>Dispatched</th><th></th></tr></thead>
  <tbody id="requestRows"></tbody>
</table></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
