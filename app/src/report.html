<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report distress – Rakshak</title>
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body data-page="report">
<header class="top"></header>
<main class="narrow">
<form id="distressForm" class="card">
  <h2>Report distress</h2>
  <label>What is happening?
    <textarea name="raw_message" rows="5" required placeholder="Who is hurt, where you are, what you need"></textarea></label>
  <div class="row">
        <label>Latitude <input name="latitude" type="number" step="any" min="-90" max="90" value="30.3165" required></label>
        <label>Longitude <input name="longitude" type="number" step="any" min="-180" max="180" value="78.0322" required></label>
      </div>
  <div class="row"><button type="button" id="geo" class="ghost">Use my location</button>
  <button class="primary">Send distress call</button></div>
  <div id="reportResult"></div>
</form>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
